<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Residentado EsSalud Cusco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #004C73;
    --azul-medio: #0077A8;
    --azul-oscuro: #00344F;
    --naranja: #F2994A;
    --naranja-oscuro: #D9791F;
    --verde: #2F9E68;
    --verde-fondo: #E7F5EE;
    --rojo: #D64545;
    --rojo-fondo: #FBEAEA;
    --gris: #5B6B76;
    --gris-claro: #EEF3F5;
    --fondo: #F3F6F8;
    --superficie: #FFFFFF;
    --texto: #1E2A32;
    --borde: #DCE6EA;
    --radio: 10px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    font-family: 'Public Sans', -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 { font-weight: 700; letter-spacing: -0.01em; }
  a { color: var(--azul-medio); }
  :focus-visible { outline: 3px solid var(--naranja); outline-offset: 2px; }

  /* ---------- Barra superior ---------- */
  header.topbar {
    background: var(--azul);
    background-image: linear-gradient(180deg, var(--azul) 0%, var(--azul-oscuro) 100%);
    color: white;
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    border-bottom: 4px solid var(--naranja);
  }
  header.topbar .marca { display: flex; align-items: baseline; gap: 10px; }
  header.topbar .marca .es { font-weight: 800; font-size: 19px; }
  header.topbar .marca .es span { color: var(--naranja); }
  header.topbar .marca small { opacity: 0.85; font-weight: 400; font-size: 12.5px; }
  header.topbar .user-info { font-size: 13px; opacity: 0.95; display: flex; align-items: center; gap: 10px; }
  header.topbar .user-info .rol-chip {
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.3);
    padding: 3px 10px;
    border-radius: 100px;
    font-size: 12px;
    text-transform: capitalize;
  }
  header.topbar button.logout {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.45);
    color: white;
    padding: 7px 14px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
  }
  header.topbar button.logout:hover { background: rgba(255,255,255,0.14); }

  main { max-width: 1180px; margin: 0 auto; padding: 24px 18px 70px; }

  /* ---------- Login ---------- */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: radial-gradient(1200px 600px at 15% 10%, #E8F1F6 0%, var(--fondo) 55%);
  }
  .login-card {
    background: var(--superficie);
    border-radius: var(--radio);
    box-shadow: 0 18px 46px rgba(0, 51, 79, 0.14);
    width: 100%;
    max-width: 400px;
    overflow: hidden;
    border-top: 5px solid var(--naranja);
  }
  .login-card .login-inner { padding: 34px 30px 28px; }
  .login-card .login-eyebrow { font-size: 12.5px; color: var(--azul-medio); font-weight: 600; margin: 0 0 4px; }
  .login-card h2 { margin: 0 0 6px; color: var(--azul-oscuro); font-size: 21px; }
  .login-card p.subtitle { color: var(--gris); font-size: 13.5px; margin: 0 0 4px; line-height: 1.5; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 16px 0 6px; color: var(--azul-oscuro); }
  input, select, textarea {
    width: 100%;
    padding: 11px 12px;
    border: 1.5px solid var(--borde);
    border-radius: 8px;
    font-size: 14.5px;
    background: white;
    font-family: inherit;
    color: var(--texto);
  }
  input:focus, select:focus, textarea:focus { border-color: var(--azul-medio); }
  select:disabled, input:disabled { background: var(--gris-claro); color: var(--gris); }
  button.primary {
    margin-top: 20px;
    width: 100%;
    background: var(--naranja);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: background .12s;
  }
  button.primary:hover { background: var(--naranja-oscuro); }
  button.primary:disabled { background: #c9c9c9; cursor: default; }
  button.secondary {
    background: white;
    color: var(--azul);
    border: 1.5px solid var(--azul);
    padding: 9px 14px;
    border-radius: 8px;
    font-size: 13.5px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
  }
  button.secondary:hover { background: var(--gris-claro); }
  .error-msg {
    background: var(--rojo-fondo);
    color: var(--rojo);
    padding: 11px 13px;
    border-radius: 8px;
    font-size: 13.5px;
    margin-top: 12px;
    border: 1px solid rgba(214,69,69,0.25);
  }
  .success-msg {
    background: var(--verde-fondo);
    color: var(--verde);
    padding: 11px 13px;
    border-radius: 8px;
    font-size: 13.5px;
    margin-top: 12px;
    border: 1px solid rgba(47,158,104,0.25);
  }

  /* ---------- Menú principal ---------- */
  .pagina-titulo { color: var(--azul-oscuro); margin: 4px 0 22px; font-size: 22px; }
  .menu-lista { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .menu-item {
    background: var(--superficie);
    border: 1px solid var(--borde);
    border-left: 4px solid var(--azul-medio);
    border-radius: 8px;
    padding: 18px 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    transition: border-color .12s, background .12s;
  }
  .menu-item:hover { background: #FAFCFD; border-left-color: var(--naranja); }
  .menu-item .texto h3 { margin: 0 0 3px; color: var(--azul-oscuro); font-size: 15.5px; }
  .menu-item .texto p { margin: 0; font-size: 13px; color: var(--gris); }
  .menu-item .flecha { color: var(--gris); font-size: 18px; }

  .back-link { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px; color: var(--azul-medio); cursor: pointer; font-size: 13.5px; font-weight: 600; }
  .back-link:hover { color: var(--azul); }

  h2.section-title { color: var(--azul-oscuro); margin: 0 0 4px; font-size: 20px; }
  p.section-sub { color: var(--gris); margin: 0 0 20px; font-size: 13.5px; }

  /* ---------- Layout matrícula (tabla + panel) ---------- */
  .layout-matricula {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 860px) {
    .layout-matricula { grid-template-columns: 1fr; }
    .panel-matricula { order: -1; }
  }

  .panel-matricula {
    background: var(--superficie);
    border-radius: var(--radio);
    border: 1px solid var(--borde);
    padding: 20px;
    position: sticky;
    top: 18px;
  }
  .panel-matricula h3 { margin: 0 0 4px; color: var(--azul-oscuro); font-size: 16px; }
  .panel-matricula .panel-sub { margin: 0 0 6px; font-size: 12.5px; color: var(--gris); line-height: 1.5; }
  .progreso-wrap { margin: 14px 0 6px; }
  .progreso-barra { height: 8px; background: var(--gris-claro); border-radius: 100px; overflow: hidden; }
  .progreso-relleno { height: 100%; background: var(--naranja); border-radius: 100px; transition: width .25s; }
  .progreso-texto { font-size: 12px; color: var(--gris); margin-top: 6px; }

  .panel-completo {
    text-align: center;
    padding: 18px 6px 4px;
  }
  .panel-completo .check-circulo {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--verde-fondo); color: var(--verde);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; margin: 0 auto 14px;
  }
  .panel-completo h3 { color: var(--azul-oscuro); margin: 0 0 8px; }
  .panel-completo p { color: var(--gris); font-size: 13.5px; line-height: 1.6; margin: 0; }

  /* ---------- Tabla horario (solo lectura) ---------- */
  .tabla-wrap { overflow-x: auto; background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 6px; }
  table.horario { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.horario th, table.horario td { border: 1px solid var(--borde); padding: 7px 8px; text-align: center; white-space: nowrap; }
  table.horario th { background: var(--gris-claro); color: var(--azul-oscuro); font-weight: 700; position: sticky; top: 0; z-index: 3; }
  table.horario th.mes-col { position: sticky; left: 0; background: var(--gris-claro); text-align: left; z-index: 4; }
  table.horario td.mes-col { position: sticky; left: 0; background: var(--superficie); text-align: left; font-weight: 600; z-index: 1; }
  .celda { padding: 6px 8px; border-radius: 6px; font-size: 11.5px; }
  .celda.disponible { background: #F0F5F8; color: var(--gris); }
  .celda.mia { background: var(--verde); color: white; font-weight: 700; }
  .celda.lleno { background: #F3F4F6; color: #97A2AA; text-decoration: line-through; }
  .celda.usada { background: var(--rojo-fondo); color: var(--rojo); text-decoration: line-through; }
  .celda.bloqueada-mes { background: #F3F4F6; color: #97A2AA; }
  .leyenda { display: flex; gap: 16px; flex-wrap: wrap; margin: 0 0 12px; font-size: 12px; color: var(--gris); }
  .leyenda span.box { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }

  /* ---------- Vista por especialidad ---------- */
  .mes-bloque { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 18px 20px; margin-bottom: 14px; }
  .mes-bloque h3 { margin-top: 0; color: var(--azul-oscuro); font-size: 15.5px; }
  .esp-fila { border-top: 1px solid var(--borde); padding: 11px 0; }
  .esp-fila:first-child { border-top: none; }
  .esp-fila .esp-nombre { font-weight: 600; color: var(--texto); }
  .esp-fila .esp-doctor { color: var(--gris); font-size: 12.5px; }
  .esp-fila .estudiantes { margin-top: 5px; font-size: 13px; }
  .chip { display: inline-block; background: var(--gris-claro); color: var(--azul-oscuro); padding: 3px 10px; border-radius: 100px; margin: 2px 4px 0 0; font-size: 12px; font-weight: 600; }

  /* ---------- Documentos ---------- */
  .filtros { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .filtros select, .filtros input { width: auto; min-width: 160px; }
  .doc-list { display: grid; gap: 10px; }
  .doc-card { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .doc-card .titulo { font-weight: 600; color: var(--texto); }
  .doc-card .meta { font-size: 12.5px; color: var(--gris); }
  .doc-card a.link-btn { background: var(--azul); color: white; padding: 8px 16px; border-radius: 7px; text-decoration: none; font-size: 13px; font-weight: 600; }
  .doc-card a.link-btn:hover { background: var(--azul-oscuro); }

  .form-box { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 20px; margin-bottom: 24px; max-width: 480px; }
  .form-box h3 { margin-top: 0; color: var(--azul-oscuro); }
  .loading { text-align: center; color: var(--gris); padding: 34px 10px; font-size: 13.5px; }
  .hidden { display: none !important; }
  .empty-state { text-align: center; color: var(--gris); padding: 30px; background: var(--superficie); border: 1px dashed var(--borde); border-radius: var(--radio); font-size: 13.5px; }
</style>
</head>
<body>

<div id="app"></div>

<script>
/*************** CONFIGURACIÓN — CAMBIAR ANTES DE PUBLICAR ***************/
var CONFIG = {
  // Pega aquí la URL /exec de tu Web App de Apps Script
  API_URL: 'https://script.google.com/macros/s/AKfycbwjHax-dtvCnDHDK0eKAwDay60sq2D40spfribYMrbNQR_HFY4wN4WUTVg1G2ISGnc4/exec'
};
/***************************************************************************/

var state = {
  usuario: JSON.parse(localStorage.getItem('residentado_usuario') || 'null'),
  vista: 'menu'
};

var app = document.getElementById('app');

// ---------------- Helpers de red ----------------
function apiGet(action, params) {
  var qs = new URLSearchParams(Object.assign({ action: action }, params || {})).toString();
  return fetch(CONFIG.API_URL + '?' + qs).then(function (r) { return r.json(); });
}
function apiPost(action, payload) {
  return fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita preflight CORS
    body: JSON.stringify(Object.assign({ action: action }, payload || {}))
  }).then(function (r) { return r.json(); });
}

function setVista(v) { state.vista = v; render(); }
function logout() {
  localStorage.removeItem('residentado_usuario');
  state.usuario = null;
  setVista('menu');
}

// ---------------- Render principal ----------------
function render() {
  if (!state.usuario) { renderLogin(); return; }
  var v = state.vista;
  if (v === 'menu') renderMenu();
  else if (v === 'registrar-residentado') renderMatricula();
  else if (v === 'residentes-por-especialidad') renderResidentesPorEspecialidad();
  else if (v === 'documentos') renderDocumentos();
  else renderMenu();
}

function rolNormalizado() {
  return state.usuario ? String(state.usuario.rol || '').toLowerCase().trim() : '';
}

function shell(contentHtml) {
  var rol = rolNormalizado();
  var rolLabel = rol === 'area_archivos' ? 'Área de archivos' : (rol === 'estudiante' ? 'Residente' : (state.usuario ? state.usuario.rol : ''));
  app.innerHTML =
    '<header class="topbar">' +
      '<div class="marca"><span class="es">Es<span>Salud</span> Cusco</span><small>Residentado médico</small></div>' +
      (state.usuario ? (
        '<div class="user-info">' + escapeHtml(state.usuario.nombre) +
        '<span class="rol-chip">' + escapeHtml(rolLabel) + '</span>' +
        '<button class="logout" onclick="logout()">Salir</button></div>'
      ) : '') +
    '</header>' +
    '<main>' + contentHtml + '</main>';
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// ==================================================================
// LOGIN
// ==================================================================
function renderLogin() {
  app.innerHTML =
    '<div class="login-wrap"><div class="login-card"><div class="login-inner">' +
      '<p class="login-eyebrow">EsSalud Cusco</p>' +
      '<h2>Residentado médico</h2>' +
      '<p class="subtitle">Ingresa con tu DNI y la contraseña entregada en la oficina de la sede.</p>' +
      '<div id="login-error"></div>' +
      '<label>DNI</label>' +
      '<input id="in-dni" inputmode="numeric" maxlength="15" placeholder="Ej. 70123456" />' +
      '<label>Contraseña</label>' +
      '<input id="in-pass" type="password" placeholder="Contraseña" />' +
      '<button class="primary" id="btn-login">Ingresar</button>' +
    '</div></div></div>';

  document.getElementById('btn-login').onclick = function () {
    var dni = document.getElementById('in-dni').value.trim();
    var pass = document.getElementById('in-pass').value.trim();
    var errBox = document.getElementById('login-error');
    errBox.innerHTML = '';
    if (!dni || !pass) {
      errBox.innerHTML = '<div class="error-msg">Ingresa tu DNI y tu contraseña.</div>';
      return;
    }
    var btn = document.getElementById('btn-login');
    btn.disabled = true; btn.textContent = 'Ingresando...';
    apiPost('login', { dni: dni, password: pass }).then(function (res) {
      btn.disabled = false; btn.textContent = 'Ingresar';
      if (res.ok) {
        state.usuario = res;
        localStorage.setItem('residentado_usuario', JSON.stringify(res));
        setVista('menu');
      } else {
        errBox.innerHTML = '<div class="error-msg">' + escapeHtml(res.error || 'No se pudo iniciar sesión.') + '</div>';
      }
    }).catch(function (err) {
      btn.disabled = false; btn.textContent = 'Ingresar';
      errBox.innerHTML = '<div class="error-msg">Error de conexión: ' + escapeHtml(err.message || err) + '</div>';
    });
  };
}

// ==================================================================
// MENÚ PRINCIPAL
// ==================================================================
function renderMenu() {
  var rol = rolNormalizado();
  var items = [];

  if (rol === 'estudiante') {
    items.push({ vista: 'registrar-residentado', titulo: 'Registrar residentado', desc: 'Elige tu especialidad para cada mes del año, uno a la vez.' });
  }
  if (rol === 'area_archivos') {
    items.push({ vista: 'documentos', titulo: 'Registrar archivos', desc: 'Sube documentos PDF del residentado.' });
  }
  items.push({ vista: 'residentes-por-especialidad', titulo: 'Residentes asignados por especialidad', desc: 'Consulta qué residentes tiene cada doctor por mes.' });
  if (rol === 'estudiante') {
    items.push({ vista: 'documentos', titulo: 'Documentos', desc: 'Revisa los documentos publicados por el área correspondiente.' });
  }

  var html = '<h2 class="pagina-titulo">¿Qué deseas hacer hoy?</h2><div class="menu-lista">';
  items.forEach(function (it) {
    html += '<div class="menu-item" data-vista="' + it.vista + '">' +
      '<div class="texto"><h3>' + it.titulo + '</h3><p>' + it.desc + '</p></div>' +
      '<div class="flecha">&rsaquo;</div></div>';
  });
  html += '</div>';

  shell(html);

  document.querySelectorAll('.menu-item').forEach(function (el) {
    el.onclick = function () { setVista(el.getAttribute('data-vista')); };
  });
}

function backLink() {
  return '<span class="back-link" onclick="setVista(\'menu\')">&larr; Volver al menú</span>';
}

// ==================================================================
// REGISTRAR RESIDENTADO — tabla informativa + panel de matrícula
// ==================================================================
var horarioData = null; // cache de la última respuesta de getHorario

function renderMatricula() {
  shell(backLink() + '<h2 class="section-title">Registrar residentado</h2>' +
        '<p class="section-sub">Residentado ' + escapeHtml(state.usuario.residentado) + ' — la matrícula se habilita mes a mes: al cerrar un mes se abre automáticamente el siguiente. La tabla de la izquierda es solo referencial.</p>' +
        '<div id="matricula-contenido" class="loading">Cargando tu horario…</div>');

  cargarHorario();
}

function cargarHorario() {
  apiGet('getHorario', { residentado: state.usuario.residentado, dni: state.usuario.dni }).then(function (res) {
    var cont = document.getElementById('matricula-contenido');
    if (!res.ok) { cont.innerHTML = '<div class="error-msg">' + escapeHtml(res.error || 'Error al cargar el horario.') + '</div>'; return; }
    horarioData = res;
    cont.innerHTML = '<div class="layout-matricula">' +
      '<div>' + construirTablaHorarioHtml(res) + '</div>' +
      '<div id="panel-matricula">' + construirPanelMatriculaHtml(res) + '</div>' +
      '</div>';
    activarPanelMatricula(res);
  }).catch(function (err) {
    document.getElementById('matricula-contenido').innerHTML = '<div class="error-msg">Error de conexión: ' + escapeHtml(err.message || err) + '</div>';
  });
}

function construirTablaHorarioHtml(res) {
  var meses = res.meses, especialidades = res.especialidades, matriz = res.matriz;

  var html = '<div class="leyenda">' +
    '<span><span class="box" style="background:#F0F5F8"></span>Disponible</span>' +
    '<span><span class="box" style="background:#2F9E68"></span>Tu elección</span>' +
    '<span><span class="box" style="background:#FBEAEA"></span>Ya la usaste</span>' +
    '<span><span class="box" style="background:#F3F4F6"></span>Sin cupo / mes ocupado</span>' +
    '</div>';
  html += '<div class="tabla-wrap"><table class="horario"><thead><tr><th class="mes-col">Mes</th>';
  especialidades.forEach(function (e) {
    html += '<th>' + escapeHtml(e.nombre) + (e.turno && e.turno !== 'único' ? '<br><small>(' + escapeHtml(e.turno) + ')</small>' : '') + '<br><small style="font-weight:400">' + escapeHtml(e.doctor) + '</small></th>';
  });
  html += '</tr></thead><tbody>';

  meses.forEach(function (mes) {
    html += '<tr><td class="mes-col">' + escapeHtml(mes.label) + '</td>';
    especialidades.forEach(function (esp) {
      var celda = matriz[mes.key][esp.codigo + '|' + esp.turno];
      var claseCelda, texto;
      if (celda.esLaMia) { claseCelda = 'mia'; texto = '✓'; }
      else if (celda.yaUsadaPorMi) { claseCelda = 'usada'; texto = '—'; }
      else if (celda.bloqueadaPorOtroMes) { claseCelda = 'bloqueada-mes'; texto = '—'; }
      else if (celda.lleno) { claseCelda = 'lleno'; texto = 'Sin cupo'; }
      else { claseCelda = 'disponible'; texto = celda.ocupados + '/' + celda.cupoMaximo; }
      html += '<td><div class="celda ' + claseCelda + '">' + texto + '</div></td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

// El mes "activo" es el primer mes del año de residentado que aún no ha
// terminado (fin >= ahora). En cuanto ese mes termina, deja de calificar
// como activo y automáticamente pasa a ser el siguiente — sin que haya
// que tocar código ni configuración.
function obtenerMesActivo(meses) {
  var ahora = Date.now();
  for (var i = 0; i < meses.length; i++) {
    if (meses[i].fin >= ahora) return meses[i];
  }
  return null; // el año de residentado ya terminó
}

function construirPanelMatriculaHtml(res) {
  var meses = res.meses;
  var totalMeses = meses.length;
  var misAsignaciones = res.misAsignaciones || {};
  var registrados = Object.keys(misAsignaciones).length;

  if (registrados >= totalMeses) {
    return '<div class="panel-completo">' +
      '<div class="check-circulo">&#10003;</div>' +
      '<h3>Registro completo</h3>' +
      '<p>Gracias — ya registraste tus ' + totalMeses + ' meses de residentado. Esta información ha quedado guardada y no podrá ser modificada. Cualquier corrección debe solicitarse directamente en la oficina.</p>' +
      '</div>';
  }

  var pct = Math.round((registrados / totalMeses) * 100);
  var progresoHtml = '<div class="progreso-wrap">' +
      '<div class="progreso-barra"><div class="progreso-relleno" style="width:' + pct + '%"></div></div>' +
      '<div class="progreso-texto">' + registrados + ' de ' + totalMeses + ' meses registrados</div>' +
    '</div>';

  var mesActivo = obtenerMesActivo(meses);

  if (!mesActivo) {
    return '<h3>Matrícula</h3>' + progresoHtml +
      '<p class="panel-sub">El año de residentado ya terminó. Si te falta algún mes por registrar, acércate a la oficina.</p>';
  }

  if (misAsignaciones[mesActivo.key]) {
    return '<h3>Matrícula</h3>' + progresoHtml +
      '<p class="panel-sub">Ya registraste tu especialidad de <strong>' + escapeHtml(mesActivo.label) + '</strong>. La matrícula del siguiente mes se habilitará automáticamente en cuanto termine este.</p>';
  }

  return '<h3>Matrícula</h3>' +
    '<p class="panel-sub">Mes actual: <strong>' + escapeHtml(mesActivo.label) + '</strong>. Elige la especialidad que quieres cursar este mes.</p>' +
    progresoHtml +
    '<div id="matricula-msg"></div>' +
    '<input type="hidden" id="mes-activo-key" value="' + mesActivo.key + '" />' +
    '<label>Especialidad</label>' +
    '<select id="sel-especialidad"></select>' +
    '<button class="primary" id="btn-matricular">Registrar mes</button>';
}

function activarPanelMatricula(res) {
  var selEsp = document.getElementById('sel-especialidad');
  if (!selEsp) return; // no hay formulario activo (año completo, terminado, o ya registró este mes)

  var especialidades = res.especialidades, matriz = res.matriz;
  var mesKey = document.getElementById('mes-activo-key').value;

  var opciones = especialidades.map(function (esp) {
    var celda = matriz[mesKey] ? matriz[mesKey][esp.codigo + '|' + esp.turno] : null;
    if (!celda) return null;
    if (celda.yaUsadaPorMi || celda.lleno) return null; // ya no se puede elegir: bloqueado
    var etiquetaTurno = esp.turno && esp.turno !== 'único' ? ' (' + esp.turno + ')' : '';
    var cupoTexto = ' — ' + celda.ocupados + '/' + celda.cupoMaximo + ' cupos';
    return '<option value="' + esp.codigo + '|' + esp.turno + '">' + escapeHtml(esp.nombre + etiquetaTurno + cupoTexto) + '</option>';
  }).filter(Boolean);
  selEsp.innerHTML = opciones.length ? opciones.join('') : '<option value="">No hay especialidades disponibles este mes</option>';

  document.getElementById('btn-matricular').onclick = function () {
    var msgBox = document.getElementById('matricula-msg');
    msgBox.innerHTML = '';
    var espVal = selEsp.value;
    if (!espVal) {
      msgBox.innerHTML = '<div class="error-msg">Elige una especialidad para continuar.</div>';
      return;
    }
    var partes = espVal.split('|');
    var codigo = partes[0], turno = partes[1];
    var esp = especialidades.filter(function (e) { return e.codigo === codigo && e.turno === turno; })[0];
    var mesInfo = res.meses.filter(function (m) { return m.key === mesKey; })[0];

    if (!confirm('¿Confirmas "' + (esp ? esp.nombre : codigo) + '" para ' + (mesInfo ? mesInfo.label : mesKey) + '?\n\nUna vez enviado, este registro no podrá modificarse.')) return;

    var btn = document.getElementById('btn-matricular');
    btn.disabled = true; btn.textContent = 'Registrando...';
    selEsp.disabled = true; // evita que se alcance a cambiar/enviar de nuevo mientras responde el servidor
    apiPost('registrarAsignacion', {
      residentado: state.usuario.residentado,
      dni: state.usuario.dni,
      mes: mesKey,
      especialidadCodigo: codigo,
      turno: turno
    }).then(function (r) {
      btn.disabled = false; btn.textContent = 'Registrar mes'; selEsp.disabled = false;
      if (r.ok) {
        msgBox.innerHTML = '<div class="success-msg">' + escapeHtml(r.mensaje) + '</div>';
        cargarHorario();
      } else {
        msgBox.innerHTML = '<div class="error-msg">' + escapeHtml(r.error) + '</div>';
        cargarHorario(); // por si el cupo o el mes cambiaron mientras decidía, refresca la vista
      }
    }).catch(function (err) {
      btn.disabled = false; btn.textContent = 'Registrar mes'; selEsp.disabled = false;
      msgBox.innerHTML = '<div class="error-msg">Error de conexión: ' + escapeHtml(err.message || err) + '</div>';
    });
  };
}

// ==================================================================
// RESIDENTES ASIGNADOS POR ESPECIALIDAD
// ==================================================================
function renderResidentesPorEspecialidad() {
  var necesitaSelector = !state.usuario.residentado;
  var residentadoActual = state.usuario.residentado || '1';

  shell(backLink() + '<h2 class="section-title">Residentes asignados por especialidad</h2>' +
        '<p class="section-sub">Vista por mes, especialidad y doctor a cargo.</p>' +
        (necesitaSelector ?
          '<div class="filtros"><select id="sel-residentado"><option value="1">Residentado 1</option><option value="2">Residentado 2</option><option value="3">Residentado 3</option></select></div>'
          : '') +
        '<div id="rpe-contenido" class="loading">Cargando…</div>');

  function cargar(residentado) {
    document.getElementById('rpe-contenido').innerHTML = '<div class="loading">Cargando…</div>';
    apiGet('getResidentesPorEspecialidad', { residentado: residentado }).then(function (res) {
      var cont = document.getElementById('rpe-contenido');
      if (!res.ok) { cont.innerHTML = '<div class="error-msg">' + escapeHtml(res.error || 'Error al cargar.') + '</div>'; return; }
      if (!res.meses.length) { cont.innerHTML = '<div class="empty-state">Aún no hay residentes asignados en meses vigentes.</div>'; return; }

      var html = '';
      res.meses.forEach(function (mes) {
        html += '<div class="mes-bloque"><h3>' + escapeHtml(mes.mesLabel) + '</h3>';
        mes.especialidades.forEach(function (esp) {
          html += '<div class="esp-fila"><div class="esp-nombre">' + escapeHtml(esp.nombre) +
            (esp.turno && esp.turno !== 'único' ? ' (' + escapeHtml(esp.turno) + ')' : '') + '</div>' +
            '<div class="esp-doctor">Doctor a cargo: ' + escapeHtml(esp.doctor || '—') + '</div>' +
            '<div class="estudiantes">' + esp.estudiantes.map(function (e) { return '<span class="chip">' + escapeHtml(e.nombre) + '</span>'; }).join('') + '</div>' +
            '</div>';
        });
        html += '</div>';
      });
      cont.innerHTML = html;
    }).catch(function (err) {
      document.getElementById('rpe-contenido').innerHTML = '<div class="error-msg">Error de conexión: ' + escapeHtml(err.message || err) + '</div>';
    });
  }

  if (necesitaSelector) {
    document.getElementById('sel-residentado').onchange = function (e) { cargar(e.target.value); };
  }
  cargar(residentadoActual);
}

// ==================================================================
// DOCUMENTOS
// ==================================================================
function renderDocumentos() {
  var esArea = rolNormalizado() === 'area_archivos';
  var residentadoFijo = state.usuario.residentado;

  var formHtml = '';
  if (esArea) {
    formHtml =
      '<div class="form-box">' +
        '<h3>Subir documento (PDF)</h3>' +
        '<div id="doc-form-msg"></div>' +
        '<label>Residentado</label>' +
        (residentadoFijo
          ? '<input value="' + escapeHtml(residentadoFijo) + '" disabled />'
          : '<select id="doc-residentado"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>') +
        '<label>Especialidad (opcional)</label>' +
        '<input id="doc-especialidad" placeholder="Ej. Gastroenterología" />' +
        '<label>Mes (opcional, formato AAAA-MM)</label>' +
        '<input id="doc-mes" placeholder="Ej. 2026-10" />' +
        '<label>Título / descripción</label>' +
        '<input id="doc-titulo" placeholder="Ej. Rol de guardias octubre" />' +
        '<label>Fecha de emisión</label>' +
        '<input id="doc-fecha" type="date" />' +
        '<label>Archivo PDF</label>' +
        '<input id="doc-archivo" type="file" accept="application/pdf" />' +
        '<button class="primary" id="btn-subir-doc">Subir documento</button>' +
      '</div>';
  }

  shell(backLink() + '<h2 class="section-title">Documentos</h2>' +
        '<p class="section-sub">Repositorio de archivos PDF del residentado.</p>' +
        formHtml +
        '<div class="filtros">' +
          '<input id="f-especialidad" placeholder="Filtrar por especialidad" />' +
          '<input id="f-mes" placeholder="Filtrar por mes (AAAA-MM)" />' +
          '<button class="secondary" id="btn-filtrar">Filtrar</button>' +
        '</div>' +
        '<div id="doc-lista" class="loading">Cargando documentos…</div>');

  function cargarDocs() {
    var params = { residentado: residentadoFijo || '' };
    var esp = document.getElementById('f-especialidad').value.trim();
    var mes = document.getElementById('f-mes').value.trim();
    if (esp) params.especialidad = esp;
    if (mes) params.mes = mes;

    document.getElementById('doc-lista').innerHTML = '<div class="loading">Cargando documentos…</div>';
    apiGet('getDocumentos', params).then(function (res) {
      var cont = document.getElementById('doc-lista');
      if (!res.ok) { cont.innerHTML = '<div class="error-msg">' + escapeHtml(res.error || 'Error al cargar.') + '</div>'; return; }
      if (!res.documentos.length) { cont.innerHTML = '<div class="empty-state">No hay documentos que coincidan con el filtro.</div>'; return; }
      cont.innerHTML = '<div class="doc-list">' + res.documentos.map(function (d) {
        return '<div class="doc-card"><div>' +
          '<div class="titulo">' + escapeHtml(d.titulo) + '</div>' +
          '<div class="meta">' + [d.especialidad, d.mes, 'Emitido: ' + d.fechaEmision].filter(Boolean).join(' · ') + '</div>' +
          '</div><a class="link-btn" href="' + d.link + '" target="_blank" rel="noopener">Ver PDF</a></div>';
      }).join('') + '</div>';
    }).catch(function (err) {
      document.getElementById('doc-lista').innerHTML = '<div class="error-msg">Error de conexión: ' + escapeHtml(err.message || err) + '</div>';
    });
  }

  document.getElementById('btn-filtrar').onclick = cargarDocs;
  cargarDocs();

  if (esArea) {
    document.getElementById('btn-subir-doc').onclick = function () {
      var residentado = residentadoFijo || document.getElementById('doc-residentado').value;
      var especialidad = document.getElementById('doc-especialidad').value.trim();
      var mes = document.getElementById('doc-mes').value.trim();
      var titulo = document.getElementById('doc-titulo').value.trim();
      var fecha = document.getElementById('doc-fecha').value;
      var archivoInput = document.getElementById('doc-archivo');
      var msgBox = document.getElementById('doc-form-msg');
      msgBox.innerHTML = '';

      if (!titulo || !fecha || !archivoInput.files.length) {
        msgBox.innerHTML = '<div class="error-msg">Completa título, fecha de emisión y selecciona un PDF.</div>';
        return;
      }
      var file = archivoInput.files[0];
      if (file.type !== 'application/pdf') {
        msgBox.innerHTML = '<div class="error-msg">Solo se permiten archivos PDF.</div>';
        return;
      }

      var reader = new FileReader();
      reader.onload = function () {
        var base64 = reader.result.split(',')[1];
        var btn = document.getElementById('btn-subir-doc');
        btn.disabled = true; btn.textContent = 'Subiendo...';
        apiPost('subirDocumento', {
          residentado: residentado,
          especialidad: especialidad,
          mes: mes,
          titulo: titulo,
          fechaEmision: fecha,
          dniArea: state.usuario.dni,
          fileBase64: base64,
          fileName: file.name,
          mimeType: file.type
        }).then(function (res) {
          btn.disabled = false; btn.textContent = 'Subir documento';
          if (res.ok) {
            msgBox.innerHTML = '<div class="success-msg">Documento subido correctamente.</div>';
            archivoInput.value = '';
            cargarDocs();
          } else {
            msgBox.innerHTML = '<div class="error-msg">' + escapeHtml(res.error || 'No se pudo subir el documento.') + '</div>';
          }
        }).catch(function (err) {
          btn.disabled = false; btn.textContent = 'Subir documento';
          msgBox.innerHTML = '<div class="error-msg">Error de conexión: ' + escapeHtml(err.message || err) + '</div>';
        });
      };
      reader.readAsDataURL(file);
    };
  }
}

// ---------------- Inicio ----------------
render();
</script>
</body>
</html>
